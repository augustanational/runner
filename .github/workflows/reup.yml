name: Reup

on:
  workflow_dispatch:
    inputs:
      urlinput:
        description: Url input
        required: true
      extinput:
        description: Extension of input
        required: true

jobs:
  reup-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download input
        run: |
          curl --location ${{ github.event.inputs.urlinput }} --output curl.${{ github.event.inputs.extinput }}

      - name: Reup
        run: |
          curl -i -F files[]=@curl.${{ github.event.inputs.extinput }} https://uguu.se/upload?output=text
